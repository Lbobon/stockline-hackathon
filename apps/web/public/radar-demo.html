<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Radar — simulation Halal Meat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root { --bg: 155 22% 7%; --fg: 150 12% 92%; --card: 155 20% 9%; --muted: 155 13% 17%; --mfg: 150 8% 63%; --border: 155 14% 18%;
    --primary: 150 58% 46%; --success: 150 55% 45%; --warning: 40 90% 56%; --voice: 258 90% 66%; --guard: 184 62% 46%; --route: 40 88% 60%; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: hsl(var(--bg)); color: hsl(var(--fg)); font-family: Inter, system-ui, sans-serif; font-size: 13px; overflow: hidden; }
  .app { display: grid; grid-template-rows: 52px 84px 1fr; height: 100%; }
  header { display: flex; align-items: center; gap: 12px; padding: 0 18px; border-bottom: 1px solid hsl(var(--border)); }
  header .t { font-weight: 600; font-size: 14px; } header .d { color: hsl(var(--mfg)); }
  .sim { margin-left: 8px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: hsl(var(--warning) / .15); color: hsl(var(--warning)); }
  .btn { margin-left: auto; background: hsl(var(--primary)); color: hsl(var(--bg)); border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 13px; cursor: pointer; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid hsl(var(--border)); }
  .kpi { padding: 12px 18px; border-right: 1px solid hsl(var(--border)); }
  .kpi .l { color: hsl(var(--mfg)); font-size: 12px; } .kpi .v { font-size: 26px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; } .kpi .s { color: hsl(var(--mfg)); font-size: 11.5px; }
  main { display: grid; grid-template-columns: 1fr 380px; min-height: 0; }
  #map { position: relative; }
  aside { border-left: 1px solid hsl(var(--border)); padding: 14px; overflow: hidden; display: flex; flex-direction: column; gap: 10px; }
  .h { font-weight: 600; display: flex; align-items: center; gap: 8px; } .live { width: 8px; height: 8px; border-radius: 50%; background: hsl(var(--success)); }
  #feed { display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
  .item { background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: 10px; padding: 10px 12px; animation: pop .3s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .item .top { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; } .item .sub { color: hsl(var(--mfg)); font-size: 12px; margin-top: 3px; }
  .eur { color: hsl(var(--success)); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .call { border-color: hsl(var(--voice) / .6); }
  .ring { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: hsl(var(--voice)); box-shadow: 0 0 0 0 hsl(var(--voice) / .6); animation: ring 1s infinite; }
  @keyframes ring { to { box-shadow: 0 0 0 10px hsl(var(--voice) / 0); } }
  .line { font-size: 12.5px; line-height: 1.45; margin-top: 6px; } .who { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: hsl(var(--mfg)); }
  .who.a { color: hsl(var(--voice)); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .chip { font-size: 10.5px; padding: 2px 6px; border-radius: 6px; background: hsl(var(--guard) / .12); color: hsl(var(--guard)); border: 1px solid hsl(var(--guard) / .35); }
  .pill { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: hsl(var(--success) / .15); color: hsl(var(--success)); font-weight: 600; }
  .ord td { padding: 2px 0; font-size: 12px; } .ord td:last-child { text-align: right; color: hsl(var(--mfg)); }
  .pin { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: hsl(var(--bg)); background: hsl(var(--primary)); border: 2px solid hsl(var(--bg)); box-shadow: 0 0 0 1px hsl(var(--primary)); }
  .pin.dep { background: hsl(var(--fg)); border-radius: 7px; } .pin.hm { background: hsl(var(--voice)); box-shadow: 0 0 0 6px hsl(var(--voice) / .25); }
  .lbl { background: hsl(var(--card) / .92); border: 1px solid hsl(var(--border)); color: hsl(var(--fg)); border-radius: 6px; padding: 2px 6px; font-size: 11px; white-space: nowrap; font-weight: 500; }
  .eta { color: hsl(var(--route)); font-weight: 600; }
  .maplibregl-ctrl-attrib { font-size: 9px; }
</style>
</head>
<body>
<div class="app">
  <header><span class="t">Radar de demande</span><span class="d">Mercredi 25 novembre</span><span class="sim">simulation</span><button class="btn" id="replay">Rejouer</button></header>

  </div>
  <main><div id="map"></div><aside><div class="h"><span class="live"></span>Activité en direct</div><div id="feed"></div></aside></main>
</div>

const pts = R.points, depot = pts[0], stops = pts.slice(1, -1), hm = pts[pts.length - 1];
const HM_ORDER = [["Poulet entier PAC halal", 100, "kg", 3.95], ["Paleron de bœuf (halal)", 125, "kg", 11.40], ["Brochettes de poulet marinées", 50, "kg", 12.80]];
const HM_TOTAL = HM_ORDER.reduce((s, l) => s + l[1] * l[3], 0);
const fmt = (n) => n.toLocaleString("fr-FR", { maximumFractionDigits: 0 }) + " €";
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const feed = document.getElementById("feed");
const $ = (id) => document.getElementById(id);
let run = 0;

// ETAs: departure 05:45 (Tournée Étang de Berre), 8 min per drop
function etas() { let t = 5 * 60 + 45; const out = []; R.legs.forEach((l, i) => { t += l[1]; out.push(t); t += 8; }); return out.map((m) => `${String(Math.floor(m / 60) % 24).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`); }

function el(cls, txt) { const d = document.createElement("div"); d.className = cls; if (txt !== undefined) d.textContent = txt; return d; }
function marker(p, cls, label, n) {
  const box = document.createElement("div"); box.style.display = "flex"; box.style.alignItems = "center"; box.style.gap = "6px";
  const pin = el("pin " + cls, n ?? ""); box.appendChild(pin);
  const lb = el("lbl"); lb.innerHTML = label; box.appendChild(lb);
  return new maplibregl.Marker({ element: box, anchor: "left", offset: [-13, 0] }).setLngLat([p.lng, p.lat]).addTo(map);
}
function add(html, cls = "") { const d = el("item " + cls); d.innerHTML = html; feed.prepend(d); while (feed.children.length > 9) feed.lastChild.remove(); return d; }
async function type(node, text, speed = 14) { node.textContent = ""; for (const ch of text) { node.textContent += ch; await sleep(speed); } }

let markers = [];
async function play() {
  const me = ++run; feed.innerHTML = ""; markers.forEach((m) => m.remove()); markers = [];

  map.flyTo({ center: [3.9, 46.2], zoom: 5.2, duration: 2200 });
  markers.push(marker(hm, "hm", "<b>Halal Meat</b> · Paris 18e", ""));

  const say = async (who, text, chips) => { const w = el("who" + (who === "Agent" ? " a" : ""), who); const l = el("line"); tx.append(w, l); await type(l, text); if (chips) { const c = el("chips"); c.innerHTML = chips.map((x) => `<span class="chip">✓ ${x}</span>`).join(""); tx.appendChild(c); } await sleep(350); };
  await sleep(1500); if (me !== run) return;
  await say("Client", "« Bonjour, ici Halal Meat à Paris. Il me faut pour demain 100 kilos de poulet halal, 125 kilos de bœuf halal et 50 kilos de viande à brochettes. »");

  await say("Client", "« Oui, c'est bon, validez. »");
  const jp = el("chips"); jp.innerHTML = '<span class="pill">Jev · oui · 0,97</span>'; tx.appendChild(jp); await sleep(600);
  await say("Agent", "« C'est validé : livraison demain, je vous ajoute à la tournée. Bonne journée ! »");
  if (me !== run) return;
  ca += HM_TOTAL; $("k-orders").textContent = "6"; $("k-ca").textContent = fmt(ca); $("k-call").textContent = "Validée"; $("k-call-s").textContent = "règles de l'ERP : OK (finalize_order)";
  add(`<div class="top"><span>Halal Meat · commande créée</span><span class="eur">${fmt(HM_TOTAL)}</span></div><table class="ord" style="width:100%;margin-top:4px">${HM_ORDER.map((l) => `<tr><td>${l[0]}</td><td>${l[1]} ${l[2]} × ${l[3].toFixed(2).replace(".", ",")} €</td></tr>`).join("")}</table>`);
  await sleep(1300); if (me !== run) return;
  // Route: draw progressively, local stops first, then north to Paris
  add(`<div class="top"><span>Tournée mise à jour</span><span class="eur" style="color:hsl(var(--route))">${R.km} km</span></div><div class="sub">Ordre optimal calculé : ${pts.map((p) => p.name.split(" ")[0] === "Restaurant" ? "Aix" : p.name.replace("MIN des Arnavaux", "Dépôt").split(" (")[0]).join(" → ")}</div>`);

  map.addSource("route", { type: "geojson", data: { type: "Feature", geometry: { type: "LineString", coordinates: [R.geometry[0]] } } });
  map.addLayer({ id: "route", type: "line", source: "route", layout: { "line-cap": "round", "line-join": "round" }, paint: { "line-color": "hsl(40, 88%, 60%)", "line-width": 4 } });

  const near = (p) => R.geometry.reduce((b, c, i) => { const d = (c[0] - p.lng) ** 2 + (c[1] - p.lat) ** 2; return d < b[0] ? [d, i] : b; }, [1e9, 0])[1];

    await sleep(350);
  }
  $("k-route").textContent = `${R.km} km`; $("k-route-s").textContent = `6 arrêts · départ 05:45 · Paris à ${ETA[ETA.length - 1]}`;
  const b = new maplibregl.LngLatBounds(); R.geometry.forEach((c) => b.extend(c)); map.fitBounds(b, { padding: 60, duration: 1500 });
}
